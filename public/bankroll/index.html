<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bankroll Lab</title>
<meta name="description" content="Track casino wins and losses for every game — logged before and after play, never at the table.">
<meta name="theme-color" content="#0E1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bankroll Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1513;--card:#17211E;--line:#263330;--line2:#34433F;--text:#F2EFE6;--muted:#A3ADA8;--gold:#E3B65A;--gold2:#F2CF84;--goldbg:#2A2414;--ink:#1A1408;--win:#5FD394;--loss:#FF8A70;--warn:#FFB84D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:8px;min-height:44px}
.top .titles{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:22px;letter-spacing:-.3px}
.h1{font-family:Archivo,sans-serif;font-weight:800;font-size:22px}
.h2{font-family:Archivo,sans-serif;font-weight:700;font-size:17px}
.sub{font-size:12px;color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}.win{color:var(--win)}.loss{color:var(--loss)}.goldc{color:var(--gold)}.warnc{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:44px;letter-spacing:-1px;line-height:1.05}
.huge{font-family:Archivo,sans-serif;font-weight:800;font-size:58px;letter-spacing:-1.5px;line-height:1.05}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text);text-decoration:none}
.back{border:none;background:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bigbtn{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:96px;text-decoration:none;cursor:pointer;text-align:left}
.bigbtn b{font-family:Archivo,sans-serif;font-weight:800;font-size:18px}
.bigbtn span{font-size:12px}
.primary{background:var(--gold);color:var(--ink);border:none}
.primary:hover{background:var(--gold2);color:var(--ink)}
.outline{background:var(--card);border:1px solid var(--gold);color:var(--text)}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--gold);color:var(--ink);font-family:Archivo,sans-serif;font-weight:800;font-size:17px;cursor:pointer;width:100%;padding:0 16px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn2{min-height:48px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;width:100%;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn2.danger{color:var(--loss);border-color:#5a2f27}
.chip{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;padding:0 6px}
.chip.on{border:2px solid var(--gold);background:var(--goldbg);font-weight:600}
.pill{flex:1;min-height:44px;border-radius:22px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;padding:0 8px}
.pill.on{border-color:var(--gold);background:var(--goldbg);color:var(--text);font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.small{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--gold);font-size:12px;font-weight:600;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field select,.field textarea{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%}
.field textarea{padding:12px 14px;min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.money input{font-family:Archivo,sans-serif;font-weight:800;font-size:26px;min-height:60px;border:2px solid var(--gold)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.item:last-child{border-bottom:none}
a.item:hover{background:#1c2824;color:var(--text)}
.item .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .l b{font-size:15px;font-weight:600}
.item .r{font-weight:700;white-space:nowrap}
.bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:visible}
.bar i{position:absolute;top:0;height:10px;border-radius:5px;display:block}
.meter{height:12px;border-radius:6px;background:var(--line);position:relative;margin:4px 0}
.meter .mid{position:absolute;left:20%;width:60%;top:0;height:12px;background:var(--line2);border-radius:6px}
.meter .dot{position:absolute;top:-4px;width:20px;height:20px;margin-left:-10px;border-radius:10px;border:3px solid var(--bg)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat span{font-size:11px;color:var(--muted)}.stat b{font-size:16px;font-weight:700}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:18px}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.banner{border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.4;border:1px solid var(--line);background:var(--card)}
.banner.warn{border-color:#6b5222;background:#231d10}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(14,21,19,.97);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;min-height:48px;justify-content:center}
.tabs a.on{color:var(--gold);font-weight:600}
.tbl{display:grid;gap:8px;align-items:center;font-size:14px;padding:11px 16px;border-bottom:1px solid var(--line)}
.tbl:last-child{border-bottom:none}
.tbl.head{font-size:11px;color:var(--muted);padding:9px 16px}
.right{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:20;max-width:90vw}
.update{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:30;max-width:536px;margin:0 auto;background:var(--gold);color:var(--ink);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.update button{min-height:40px;border-radius:10px;border:none;padding:0 12px;font-weight:700;cursor:pointer}
.update .now{background:var(--ink);color:var(--gold)}.update .later{background:transparent;color:var(--ink)}
.version{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:6px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.help h3{font-family:Archivo,sans-serif;font-size:16px;margin:8px 0 0}
.help p,.help li{font-size:14px;line-height:1.5;color:#d9d6cd}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:76px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--card);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.addphoto{width:76px;height:76px;border-radius:12px;border:1px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--gold);cursor:pointer;text-align:center;padding:4px}
.addphoto:focus-within,.filebtn:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.filebtn{cursor:pointer}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.viewer img{max-width:100%;max-height:72vh;border-radius:12px;object-fit:contain}
.vbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:480px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.qrow{display:flex;flex-direction:row;gap:8px;align-items:stretch}
.qrow input{flex:1;min-width:0}
.insight{font-size:15px;line-height:1.45}
.printonly{display:none}
@media print{
 body{background:#fff;color:#000;padding:0}
 .wrap,.tabs,.toast,.update{display:none!important}
 .printonly{display:block;font-family:Inter,Arial,sans-serif;color:#000;padding:24px}
 .printonly table{border-collapse:collapse;width:100%;font-size:11px}
 .printonly th,.printonly td{border:1px solid #999;padding:4px 6px;text-align:left}
 .printonly td.n{text-align:right}
}
</style>
</head>
